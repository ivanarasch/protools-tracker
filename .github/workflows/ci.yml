# On every push and pull request: run the tests, build the app, and save the .zip as a download.
# Pushing a version tag (like v1.9) also publishes the .zip as a public GitHub Release.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: write   # needed to create releases

jobs:
  test-and-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test tools
        run: pip install pytest

      - name: Run tests
        run: ./test.sh

      - name: Build app
        run: ./build.sh

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Pro-Tools-Time-Tracker
          path: build/Pro Tools Time Tracker.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Pro Tools Time Tracker.zip
          generate_release_notes: true
